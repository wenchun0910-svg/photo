<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">活動相簿集錦</title>
    <!-- 引入 Tailwind CSS 進行快速排版與響應式設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Phosphor Icons 圖示庫 -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- 引入 Quill 富文本編輯器 CSS 與 JS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    
    <style>
        /* 現代藍色系風格 */
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
        }
        
        .transition-all { transition: all 0.3s ease; }
        .image-container { overflow: hidden; }
        .image-container img { transition: transform 0.5s ease; }
        .image-container:hover img { transform: scale(1.05); }
        
        /* 現代感自訂捲軸 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Quill 編輯器樣式微調 */
        .ql-container { font-family: inherit; font-size: 1rem; border-bottom-left-radius: 0.5rem; border-bottom-right-radius: 0.5rem; }
        .ql-toolbar { border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; background-color: #f8fafc; }
        .ql-editor { min-height: 120px; }
        
        /* 卡片與全文檢視內富文本顯示微調 */
        .rich-text-content p { margin-bottom: 0.25rem; }
        .rich-text-content a { color: #2563eb; text-decoration: underline; cursor: pointer; }
        /* 強制全文檢視模式套用 Quill 樣式，但移除多餘內邊距 */
        .ql-editor.view-mode { padding: 0; min-height: auto; overflow-y: visible; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- 導覽列 (整合搜尋與管理工具) -->
    <nav class="bg-gradient-to-r from-blue-950 to-blue-800 shadow-lg border-b-[3px] border-sky-400 sticky top-0 z-40 py-2.5">
        <div class="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col xl:flex-row justify-between items-center gap-4">
                
                <!-- 1. 左側：網站標題 -->
                <div class="flex items-center space-x-3 w-full xl:w-auto justify-between xl:justify-start shrink-0">
                    <div class="flex items-center group">
                        <i class="ph-fill ph-cloud-sun text-sky-400 text-3xl mr-2"></i>
                        <span id="navTitle" class="font-bold text-xl text-white tracking-wide">活動相簿集錦</span>
                        <button id="editTitleBtn" onclick="openTitleModal()" class="hidden ml-2 text-blue-300 hover:text-white bg-blue-800 hover:bg-blue-600 rounded p-1.5 transition-colors" title="修改網站標題">
                            <i class="ph ph-pencil-simple text-sm"></i>
                        </button>
                    </div>
                    <!-- 行動版登入按鈕 (小螢幕顯示，大螢幕隱藏) -->
                    <button id="authBtnMobile" onclick="toggleAuth()" class="xl:hidden flex items-center space-x-1 text-sm font-medium text-blue-200 hover:text-white transition-colors bg-blue-900/50 hover:bg-blue-700/50 border border-blue-700/50 px-3 py-1.5 rounded-lg">
                        <i class="ph ph-user text-lg" id="authIconMobile"></i>
                        <span id="authTextMobile">管理員</span>
                    </button>
                </div>

                <!-- 2. 中間：搜尋框與系統管理工具 -->
                <div class="flex flex-col lg:flex-row items-center gap-3 w-full xl:w-auto flex-1 xl:justify-end">
                    
                    <!-- 搜尋框 -->
                    <div class="relative w-full lg:w-72 xl:w-80 shrink-0">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="ph ph-magnifying-glass text-blue-500 text-lg"></i>
                        </div>
                        <input type="text" id="searchInput" oninput="handleSearch()" class="block w-full pl-10 pr-3 py-2 border border-blue-300/30 rounded-lg leading-5 bg-white/95 placeholder-slate-400 focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-300 focus:bg-white sm:text-sm transition-all shadow-inner" placeholder="輸入關鍵字搜尋相簿...">
                    </div>

                    <!-- 管理員工具列 (登入後顯示) -->
                    <div id="adminToolbar" class="hidden flex items-center bg-blue-50/10 p-1.5 rounded-lg border border-blue-400/30 w-full lg:w-auto overflow-x-auto shadow-sm">
                        <span class="text-blue-100 font-bold mx-2 hidden 2xl:inline whitespace-nowrap text-sm">
                            <i class="ph-fill ph-shield-check text-sky-400 mr-1 align-middle text-lg"></i>系統管理
                        </span>
                        <div class="flex space-x-2 w-full lg:w-auto">
                            <button onclick="openTagsModal()" class="bg-indigo-600/90 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-md shadow-sm flex items-center justify-center flex-1 lg:flex-none space-x-1.5 transition-colors text-sm font-medium">
                                <i class="ph ph-tag text-lg"></i><span class="whitespace-nowrap">心情標籤</span>
                            </button>
                            <button onclick="openAccountListModal()" class="bg-slate-700/90 hover:bg-slate-600 text-white px-3 py-1.5 rounded-md shadow-sm flex items-center justify-center flex-1 lg:flex-none space-x-1.5 transition-colors text-sm font-medium">
                                <i class="ph ph-users text-lg"></i><span class="whitespace-nowrap">管理帳號</span>
                            </button>
                            <button onclick="openPhotoModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-md shadow-sm flex items-center justify-center flex-1 lg:flex-none space-x-1.5 transition-colors text-sm font-medium border border-blue-400/50">
                                <i class="ph ph-plus-circle text-lg"></i><span class="whitespace-nowrap">新增相簿</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 3. 右側：桌面版登入按鈕 -->
                <div class="hidden xl:flex w-full xl:w-auto justify-end shrink-0">
                    <button id="authBtnDesktop" onclick="toggleAuth()" class="flex items-center space-x-1 text-sm font-medium text-blue-200 hover:text-white transition-colors bg-blue-900/50 hover:bg-blue-700/50 border border-blue-700/50 px-4 py-2 rounded-lg">
                        <i class="ph ph-user text-lg" id="authIconDesktop"></i>
                        <span id="authTextDesktop">管理員登入</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- 載入中動畫 -->
        <div id="loadingIndicator" class="flex justify-center items-center py-16">
            <div class="text-center">
                <i class="ph ph-spinner animate-spin text-5xl text-blue-500 mb-3"></i>
                <p class="text-slate-500 font-medium">載入資料庫中...</p>
            </div>
        </div>

        <!-- 相簿網格 -->
        <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        
        <!-- 無資料提示 -->
        <div id="emptyState" class="hidden text-center py-24 text-slate-400">
            <i class="ph-thin ph-images text-7xl mb-4 text-slate-300"></i>
            <p class="text-lg text-slate-500" id="emptyStateText">目前還沒有任何照片喔！</p>
        </div>

        <!-- 分頁控制區 -->
        <div id="paginationContainer" class="mt-10 flex justify-center hidden">
            <nav class="relative z-0 inline-flex rounded-lg shadow-sm -space-x-px" aria-label="Pagination" id="paginationControls"></nav>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="text-center text-sm text-slate-500" id="footerText">
            &copy; 2026 活動相簿集錦系統 (Powered by Firebase).
        </div>
    </footer>

    <!-- ================= 互動視窗 (Modals) ================= -->

    <!-- 全文檢視視窗 (新功能) -->
    <div id="fullDescModal" class="fixed inset-0 bg-slate-900 bg-opacity-60 z-[60] hidden flex items-center justify-center backdrop-blur-sm overflow-y-auto pt-10 pb-10">
        <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 max-w-2xl w-full mx-4 my-auto relative">
            <button onclick="closeModal('fullDescModal')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 hover:bg-slate-100 p-1.5 rounded-full transition-colors">
                <i class="ph ph-x text-2xl"></i>
            </button>
            <h2 id="fullDescModalTitle" class="text-2xl font-bold text-slate-800 mb-4 border-b border-slate-100 pb-3"></h2>
            <!-- 加上 ql-editor 類別讓文字能吃到 Quill 的字體顏色/大小設定 -->
            <div id="fullDescModalContent" class="ql-editor view-mode rich-text-content text-slate-700 leading-relaxed overflow-y-auto max-h-[60vh] pr-2">
                <!-- 全文內容 -->
            </div>
            <div class="mt-6 flex justify-end border-t border-slate-100 pt-4">
                <button onclick="closeModal('fullDescModal')" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow-sm transition-colors">關閉閱讀</button>
            </div>
        </div>
    </div>

    <!-- 修改網站標題視窗 -->
    <div id="titleEditModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full mx-4 relative">
            <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
                <i class="ph-fill ph-text-t text-blue-600 mr-2"></i> 修改網站標題
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">新網站名稱</label>
                    <input type="text" id="editWebsiteTitle" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none">
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button onclick="closeModal('titleEditModal')" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg font-medium">取消</button>
                    <button onclick="saveWebsiteTitle()" class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow-sm font-medium">儲存修改</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 管理心情標籤視窗 -->
    <div id="tagsManageModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full mx-4 relative">
            <button onclick="closeModal('tagsManageModal')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 hover:bg-slate-100 p-1 rounded-full">
                <i class="ph ph-x text-2xl"></i>
            </button>
            <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
                <i class="ph-fill ph-tags text-indigo-600 mr-2"></i> 心情標籤管理
            </h2>
            <div class="flex space-x-2 mb-4">
                <input type="text" id="newTagInput" placeholder="輸入新標籤名稱..." class="flex-grow px-3 py-2 border border-slate-300 rounded-lg focus:border-indigo-500 outline-none">
                <button onclick="addNewTag()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm whitespace-nowrap">新增</button>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 max-h-60 overflow-y-auto">
                <p id="noTagsMsg" class="text-sm text-slate-400 text-center py-4 hidden">目前尚未建立任何標籤</p>
                <ul id="tagsListContainer" class="space-y-2"></ul>
            </div>
        </div>
    </div>

    <!-- 登入視窗 -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4 transform transition-all">
            <div class="text-center mb-6">
                <div class="mx-auto w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mb-4">
                    <i class="ph-fill ph-lock-key text-3xl text-blue-600"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">管理員登入</h2>
            </div>
            <div class="space-y-4">
                <input type="text" id="loginUsername" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:border-blue-500 outline-none bg-slate-50 focus:bg-white transition-colors" placeholder="帳號">
                <input type="password" id="loginPassword" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:border-blue-500 outline-none bg-slate-50 focus:bg-white transition-colors" placeholder="密碼">
                <button onclick="checkLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg flex justify-center items-center shadow-sm">
                    登入 <i id="loginSpinner" class="ph ph-spinner animate-spin text-xl ml-2 hidden"></i>
                </button>
                <button onclick="closeModal('loginModal')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-lg mt-2">取消</button>
            </div>
        </div>
    </div>

    <!-- 新增/編輯照片視窗 -->
    <div id="photoModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm overflow-y-auto pt-10 pb-10">
        <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 max-w-2xl w-full mx-4 my-auto relative">
            <button onclick="closeModal('photoModal')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 rounded-full">
                <i class="ph ph-x text-2xl"></i>
            </button>
            <div class="flex items-center mb-6">
                <i class="ph-fill ph-image text-blue-600 text-2xl mr-2"></i>
                <h2 id="photoModalTitle" class="text-2xl font-bold text-slate-800">新增相簿</h2>
            </div>
            
            <form id="photoForm" onsubmit="savePhoto(event)" class="space-y-5">
                <input type="hidden" id="photoId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">活動標題 <span class="text-red-500">*</span></label>
                        <input type="text" id="photoTitle" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">活動日期 <span class="text-red-500">*</span></label>
                        <input type="date" id="photoDate" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-blue-500 outline-none">
                    </div>
                </div>

                <!-- 心情標籤選擇區 -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">心情標籤 (可複選)</label>
                    <div id="tagCheckboxesContainer" class="flex flex-wrap gap-2 p-3 bg-slate-50 border border-slate-200 rounded-lg min-h-[50px]">
                        <!-- Checkboxes dynamically generated here -->
                    </div>
                </div>

                <div class="bg-sky-50/50 p-4 rounded-xl border border-sky-100 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-sky-900 mb-1">1. 相簿前往連結 <span class="text-red-500">*</span></label>
                        <input type="url" id="photoUrl" required placeholder="點擊後開啟的網址" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-sky-900 mb-1">2. 封面縮圖 (單張照片連結) <span class="text-red-500">*</span></label>
                        <input type="url" id="thumbnailUrl" required placeholder="雲端硬碟單張照片網址" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-blue-500 outline-none">
                    </div>
                </div>
                
                <!-- 富文本編輯器 (Quill) -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">活動說明描述</label>
                    <!-- Quill Container -->
                    <div id="quill-editor" class="bg-white"></div>
                </div>

                <div class="flex justify-end space-x-3 pt-5 border-t border-slate-100">
                    <button type="button" onclick="closeModal('photoModal')" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium">取消</button>
                    <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-sm font-medium flex items-center">
                        <i class="ph ph-floppy-disk mr-2 text-lg"></i> 儲存
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 刪除確認與帳號管理 (保持簡潔) -->
    <div id="deleteModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl p-8 max-w-sm w-full mx-4 text-center">
            <i class="ph-fill ph-trash text-5xl text-red-600 mb-2"></i>
            <h2 class="text-xl font-bold mb-6 text-slate-800">確定要刪除嗎？</h2>
            <input type="hidden" id="deleteId"><input type="hidden" id="deleteType" value="photo">
            <div class="flex justify-center space-x-3">
                <button onclick="closeModal('deleteModal')" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg">取消</button>
                <button onclick="confirmDelete()" class="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg">確認刪除</button>
            </div>
        </div>
    </div>

    <div id="accountListModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl p-6 max-w-lg w-full mx-4 relative">
            <button onclick="closeModal('accountListModal')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="ph ph-x text-2xl"></i></button>
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-bold text-slate-800"><i class="ph-fill ph-users text-blue-600 mr-2"></i>帳號管理</h2>
                <button onclick="openAccountEditModal()" class="bg-sky-50 text-sky-700 px-3 py-1.5 rounded-lg text-sm border border-sky-200">新增帳號</button>
            </div>
            <table class="min-w-full divide-y divide-slate-200"><tbody id="userListBody"></tbody></table>
        </div>
    </div>

    <div id="accountEditModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-[60] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full mx-4 relative">
            <h2 id="accountEditModalTitle" class="text-xl font-bold mb-4">新增帳號</h2>
            <form onsubmit="saveUser(event)" class="space-y-4">
                <input type="hidden" id="editUserId">
                <input type="text" id="editUsername" required class="w-full px-4 py-2 border rounded-lg focus:border-blue-500 outline-none" placeholder="帳號">
                <input type="password" id="editPassword" required class="w-full px-4 py-2 border rounded-lg focus:border-blue-500 outline-none" placeholder="密碼">
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal('accountEditModal')" class="px-4 py-2 bg-slate-100 rounded-lg">取消</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 吐司通知 -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-[70] flex items-center bg-slate-800 text-white px-6 py-3.5 rounded-xl shadow-2xl pointer-events-none">
        <i id="toastIcon" class="ph-fill ph-check-circle text-sky-400 text-xl mr-3"></i>
        <span id="toastMessage" class="font-medium">操作成功</span>
    </div>

    <!-- ================= JavaScript / Firebase 邏輯 ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 初始化變數
        let app, auth, db, currentUser;
        const systemAppId = 'default-album-app'; 

        // 狀態與資料
        let isAdmin = false;
        let usersData = [];
        let photosData = [];
        let globalSettings = { title: '活動相簿集錦', moodTags: [] };
        
        let currentPage = 1;
        const itemsPerPage = 8;
        let searchQuery = '';
        let quillEditor; // Quill 編輯器實例

        // --- 1. 系統初始化 ---
        const initSystem = async () => {
            try {
                // 初始化 Quill 編輯器
                quillEditor = new Quill('#quill-editor', {
                    theme: 'snow',
                    placeholder: '寫下活動的精采說明...',
                    modules: {
                        toolbar: [
                            [{ 'size': ['small', false, 'large', 'huge'] }],
                            [{ 'color': [] }, { 'background': [] }],
                            ['bold', 'italic', 'underline', 'strike'],
                            ['link', 'clean']
                        ]
                    }
                });

             const firebaseConfig = {
  apiKey: "AIzaSyCEE72yBbcuTH_OtatNyFRYZXwRYJXPRcM",
  authDomain: "photo-9e02b.firebaseapp.com",
  projectId: "photo-9e02b",
  storageBucket: "photo-9e02b.firebasestorage.app",
  messagingSenderId: "220524122796",
  appId: "1:220524122796:web:f1fb0ee8388fd4fdb48509"
};

                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (user) setupRealtimeListeners();
                });

            } catch (error) {
                console.error("Initialization Error:", error);
                document.getElementById('loadingIndicator').innerHTML = `<p class="text-red-500">系統初始化失敗</p>`;
            }
        };

        // --- 2. 即時監聽 ---
        const setupRealtimeListeners = () => {
            if (!currentUser) return;

            // 監聽全域設定 (標題與標籤)
            onSnapshot(doc(db, 'artifacts', systemAppId, 'public', 'data', 'settings', 'global'), (docSnap) => {
                if (docSnap.exists()) {
                    globalSettings = docSnap.data();
                } else {
                    globalSettings = { title: '活動相簿集錦', moodTags: [] };
                }
                updateGlobalUI();
            });

            onSnapshot(collection(db, 'artifacts', systemAppId, 'public', 'data', 'albums'), (snapshot) => {
                photosData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                document.getElementById('loadingIndicator').classList.add('hidden');
                renderGallery();
            });

            onSnapshot(collection(db, 'artifacts', systemAppId, 'public', 'data', 'accounts'), (snapshot) => {
                usersData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderUsers();
            });
        };

        // 更新全域 UI (網站標題等)
        const updateGlobalUI = () => {
            document.title = globalSettings.title;
            document.getElementById('navTitle').innerText = globalSettings.title;
            document.getElementById('footerText').innerHTML = `&copy; 2026 ${globalSettings.title} (Powered by Firebase).`;
            renderTagCheckboxes();
            renderManageTagsList();
        };

        // --- 3. 畫面渲染 ---
        const formatImageUrl = (url) => {
            if (!url) return '';
            const match = url.match(/(?:drive\.google\.com\/file\/d\/|drive\.google\.com\/open\?id=)([-a-zA-Z0-9_]+)/);
            if (match && match[1]) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
            return url; 
        };

        const renderGallery = () => {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            
            // 搜尋過濾 (純文字過濾，去除 html 標籤以便精確搜尋)
            let filteredData = photosData;
            if (searchQuery) {
                filteredData = photosData.filter(photo => {
                    const cleanDesc = photo.desc ? photo.desc.replace(/<[^>]*>?/gm, '') : '';
                    return (photo.title && photo.title.toLowerCase().includes(searchQuery)) || 
                           (cleanDesc.toLowerCase().includes(searchQuery));
                });
            }

            if (filteredData.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('paginationContainer').classList.add('hidden');
            } else {
                document.getElementById('emptyState').classList.add('hidden');
                const sortedData = [...filteredData].sort((a, b) => new Date(b.date) - new Date(a.date));

                const totalPages = Math.ceil(sortedData.length / itemsPerPage);
                if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
                
                const paginatedData = sortedData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

                paginatedData.forEach(photo => {
                    let targetUrl = photo.url;
                    let thumbUrl = photo.url;
                    if (photo.url && photo.url.includes("|||")) {
                        const parts = photo.url.split("|||");
                        targetUrl = parts[0]; thumbUrl = parts[1];
                    }

                    // 渲染心情標籤
                    let tagsHtml = '';
                    if (photo.tags && photo.tags.length > 0) {
                        tagsHtml = `<div class="flex flex-wrap gap-1.5 mt-1.5 mb-1">` + 
                            photo.tags.map(t => `<span class="bg-indigo-50 text-indigo-700 border border-indigo-100 text-xs px-2.5 py-0.5 rounded-md font-medium tracking-wide shadow-sm">${t}</span>`).join('') + 
                            `</div>`;
                    }

                    let adminButtons = isAdmin ? `
                        <div class="absolute top-3 right-3 flex space-x-2 opacity-0 group-hover:opacity-100 transition-opacity z-20">
                            <button onclick="editPhoto(event, '${photo.id}')" class="bg-white/95 text-blue-600 p-2 rounded-lg shadow-md hover:bg-blue-50 transition-colors backdrop-blur-sm"><i class="ph ph-pencil-simple text-lg"></i></button>
                            <button onclick="promptDelete(event, '${photo.id}', 'photo')" class="bg-white/95 text-red-500 p-2 rounded-lg shadow-md hover:bg-red-50 transition-colors backdrop-blur-sm"><i class="ph ph-trash text-lg"></i></button>
                        </div>` : '';

                    // 計算純文字長度，判斷是否需要顯示「閱讀全文」按鈕
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = photo.desc || '';
                    const plainText = tempDiv.textContent || tempDiv.innerText || "";
                    const needsReadMore = plainText.length > 45;

                    const readMoreBtn = needsReadMore ? 
                        `<button onclick="openFullDesc(event, '${photo.id}')" class="text-blue-600 hover:text-blue-800 text-xs font-semibold mt-1.5 flex items-center transition-colors z-20 relative"><i class="ph-bold ph-book-open mr-1"></i>閱讀全文</button>` : '';

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl border border-slate-200 overflow-hidden hover:shadow-xl hover:border-blue-300 transition-all duration-300 relative group flex flex-col";
                    card.innerHTML = `
                        ${adminButtons}
                        <a href="${targetUrl}" target="_blank" rel="noopener noreferrer" onclick="recordView('${photo.id}')" class="flex-grow flex flex-col group/link relative z-10">
                            <div class="image-container relative w-full pt-[66.66%] bg-slate-100 border-b border-slate-100">
                                <img src="${formatImageUrl(thumbUrl)}" onerror="if(this.src.includes('thumbnail')){ this.src=this.src.replace('thumbnail?id=','uc?export=view&id=').replace('&sz=w1000',''); } else { this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIHZpZXdCb3g9IjAgMCA4MDAgNjAwIiBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSJub25lIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjFmNWY5Ii8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjI0IiBmaWxsPSIjOTRhM2I4IiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj7lnJbniYfnhJHms5Xpoa/npLo8L3RleHQ+PC9zdmc+'; }" class="absolute top-0 left-0 w-full h-full object-cover">
                                <div class="absolute inset-0 bg-blue-900 bg-opacity-0 group-hover/link:bg-opacity-40 transition-all duration-500 flex items-center justify-center">
                                    <div class="bg-white/95 text-blue-900 px-5 py-2.5 rounded-full font-bold opacity-0 group-hover/link:opacity-100 transform translate-y-4 group-hover/link:translate-y-0 transition-all duration-300 flex items-center shadow-xl border border-blue-100">
                                        <i class="ph-bold ph-arrow-square-out mr-2"></i> 前往相簿
                                    </div>
                                </div>
                            </div>
                            <div class="p-5 flex-grow flex flex-col bg-white">
                                <h3 class="font-bold text-lg text-slate-800 line-clamp-1 group-hover/link:text-blue-600 transition-colors">${photo.title}</h3>
                                <p class="text-xs text-slate-500 flex items-center mt-1 font-medium"><i class="ph-fill ph-calendar-blank mr-1 text-slate-400"></i> ${photo.date}</p>
                                ${tagsHtml}
                                <div class="flex flex-col mt-auto pt-3 border-t border-slate-100">
                                    <!-- 放寬限制到 line-clamp-3 以容納約 50 個字 -->
                                    <div class="text-slate-600 text-sm line-clamp-3 pr-1 rich-text-content leading-relaxed">${photo.desc || '無說明'}</div>
                                    <div class="flex justify-between items-end mt-1">
                                        <div>${readMoreBtn}</div>
                                        <div class="flex items-center text-sky-700 text-xs shrink-0 bg-sky-50 border border-sky-100 px-2.5 py-1.5 rounded-lg shadow-sm" title="瀏覽人次">
                                            <i class="ph-fill ph-eye mr-1.5 text-sky-500"></i><span id="view-count-${photo.id}" class="font-semibold">${photo.views || 0}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    `;
                    grid.appendChild(card);
                });
                renderPagination(sortedData.length, totalPages);
            }
        };

        // --- 4. 分頁邏輯 ---
        const changePage = (page) => { currentPage = page; renderGallery(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        const renderPagination = (totalItems, totalPages) => {
            const controls = document.getElementById('paginationControls');
            document.getElementById('paginationContainer').classList.toggle('hidden', totalPages <= 1);
            if(totalPages <= 1) return;
            
            controls.innerHTML = `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="px-3 py-2 border rounded-l-lg ${currentPage===1?'text-slate-300':'hover:bg-slate-50'}"><i class="ph-bold ph-caret-left"></i></button>`;
            for (let i = 1; i <= totalPages; i++) {
                controls.innerHTML += `<button onclick="changePage(${i})" class="px-4 py-2 border text-sm font-semibold ${i===currentPage?'bg-blue-600 text-white':'hover:bg-slate-50 text-slate-600'}">${i}</button>`;
            }
            controls.innerHTML += `<button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="px-3 py-2 border rounded-r-lg ${currentPage===totalPages?'text-slate-300':'hover:bg-slate-50'}"><i class="ph-bold ph-caret-right"></i></button>`;
        };

        // --- 5. Firebase 操作 (標題、標籤、相簿) ---

        // 標題設定
        const saveWebsiteTitle = async () => {
            const newTitle = document.getElementById('editWebsiteTitle').value.trim();
            if (!newTitle) return;
            try {
                await setDoc(doc(db, 'artifacts', systemAppId, 'public', 'data', 'settings', 'global'), { title: newTitle }, { merge: true });
                closeModal('titleEditModal');
                showToast("網站標題已更新");
            } catch (e) { showToast("標題更新失敗", "error"); }
        };

        // 標籤設定
        const renderManageTagsList = () => {
            const list = document.getElementById('tagsListContainer');
            const noMsg = document.getElementById('noTagsMsg');
            list.innerHTML = '';
            
            const tags = globalSettings.moodTags || [];
            if(tags.length === 0) { noMsg.classList.remove('hidden'); return; }
            noMsg.classList.add('hidden');

            tags.forEach((tag, index) => {
                list.innerHTML += `
                    <li class="flex justify-between items-center bg-white border border-slate-200 px-3 py-2 rounded-lg">
                        <span class="text-sm font-medium text-slate-700">${tag}</span>
                        <button onclick="deleteTag(${index})" class="text-red-500 hover:bg-red-50 p-1 rounded transition-colors"><i class="ph ph-trash"></i></button>
                    </li>`;
            });
        };

        const renderTagCheckboxes = () => {
            const container = document.getElementById('tagCheckboxesContainer');
            if(!container) return;
            const tags = globalSettings.moodTags || [];
            if(tags.length === 0) { container.innerHTML = '<span class="text-slate-400 text-sm">請先在「心情標籤」管理中新增標籤</span>'; return; }
            
            container.innerHTML = tags.map((tag, i) => `
                <label class="inline-flex items-center bg-white border border-slate-200 px-3 py-1.5 rounded-lg cursor-pointer hover:bg-slate-50 transition-colors">
                    <input type="checkbox" value="${tag}" class="form-checkbox h-4 w-4 text-blue-600 rounded border-slate-300 tag-checkbox">
                    <span class="ml-2 text-sm text-slate-700 font-medium">${tag}</span>
                </label>
            `).join('');
        };

        const addNewTag = async () => {
            const input = document.getElementById('newTagInput');
            const newTag = input.value.trim();
            if (!newTag) return;
            
            const currentTags = globalSettings.moodTags || [];
            if(currentTags.includes(newTag)) { showToast("標籤已存在", "error"); return; }
            
            try {
                const updatedTags = [...currentTags, newTag];
                await setDoc(doc(db, 'artifacts', systemAppId, 'public', 'data', 'settings', 'global'), { moodTags: updatedTags }, { merge: true });
                input.value = '';
                showToast("標籤已新增");
            } catch (e) { showToast("新增失敗", "error"); }
        };

        const deleteTag = async (index) => {
            try {
                let tags = [...globalSettings.moodTags];
                tags.splice(index, 1);
                await setDoc(doc(db, 'artifacts', systemAppId, 'public', 'data', 'settings', 'global'), { moodTags: tags }, { merge: true });
                showToast("標籤已刪除");
            } catch(e) { showToast("刪除失敗", "error"); }
        };

        // 相簿設定
        const savePhoto = async (event) => {
            event.preventDefault();
            if (!currentUser) return;

            // 收集打勾的標籤
            const checkedTags = Array.from(document.querySelectorAll('.tag-checkbox:checked')).map(cb => cb.value);
            // 獲取 Quill 富文本 HTML
            const richDesc = quillEditor.root.innerHTML;

            const id = document.getElementById('photoId').value;
            const combinedUrl = document.getElementById('photoUrl').value + "|||" + document.getElementById('thumbnailUrl').value;
            const payload = {
                title: document.getElementById('photoTitle').value,
                url: combinedUrl,
                date: document.getElementById('photoDate').value,
                desc: richDesc === '<p><br></p>' ? '' : richDesc, // 處理 Quill 的空內容
                tags: checkedTags
            };

            closeModal('photoModal');
            try {
                if (id) {
                    await updateDoc(doc(db, 'artifacts', systemAppId, 'public', 'data', 'albums', id), payload);
                    showToast("相簿已更新");
                } else {
                    payload.views = 0; 
                    await addDoc(collection(db, 'artifacts', systemAppId, 'public', 'data', 'albums'), payload);
                    showToast("相簿已新增");
                }
            } catch (error) { showToast("儲存失敗", "error"); }
        };

        const editPhoto = (event, id) => {
            event.preventDefault();
            event.stopPropagation(); // 避免點擊編輯觸發外層 <a> 標籤開啟雲端硬碟

            const photo = photosData.find(p => p.id === id);
            if (!photo) return;

            let targetUrl = photo.url || ''; let thumbUrl = photo.url || '';
            if (photo.url && photo.url.includes("|||")) {
                const parts = photo.url.split("|||"); targetUrl = parts[0]; thumbUrl = parts[1];
            }

            document.getElementById('photoId').value = photo.id;
            document.getElementById('photoTitle').value = photo.title;
            document.getElementById('photoUrl').value = targetUrl;
            document.getElementById('thumbnailUrl').value = thumbUrl;
            document.getElementById('photoDate').value = photo.date;
            
            // 恢復富文本內容
            quillEditor.root.innerHTML = photo.desc || '';
            
            // 恢復打勾狀態
            document.querySelectorAll('.tag-checkbox').forEach(cb => {
                cb.checked = (photo.tags && photo.tags.includes(cb.value));
            });
            
            document.getElementById('photoModalTitle').innerText = '編輯相簿';
            document.getElementById('photoModal').classList.remove('hidden');
        };

        const recordView = async (id) => {
            const photo = photosData.find(p => p.id === id);
            if (photo && currentUser) {
                const newViews = (photo.views || 0) + 1;
                document.getElementById(`view-count-${id}`).innerText = newViews;
                await updateDoc(doc(db, 'artifacts', systemAppId, 'public', 'data', 'albums', id), { views: newViews });
            }
        };

        const promptDelete = (event, id, type) => {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            document.getElementById('deleteId').value = id;
            document.getElementById('deleteType').value = type;
            document.getElementById('deleteModal').classList.remove('hidden');
        };

        const confirmDelete = async () => {
            if (!currentUser) return;
            const id = document.getElementById('deleteId').value;
            const type = document.getElementById('deleteType').value;
            closeModal('deleteModal');
            try {
                if (type === 'photo') { await deleteDoc(doc(db, 'artifacts', systemAppId, 'public', 'data', 'albums', id)); showToast("相簿已刪除"); }
                else { await deleteDoc(doc(db, 'artifacts', systemAppId, 'public', 'data', 'accounts', id)); showToast("帳號已刪除"); }
            } catch (error) { showToast("刪除失敗", "error"); }
        };

        // 開啟全文檢視 Modal
        const openFullDesc = (event, id) => {
            event.preventDefault(); 
            event.stopPropagation(); // 避免點擊閱讀全文時觸發前往雲端硬碟

            const photo = photosData.find(p => p.id === id);
            if (photo) {
                document.getElementById('fullDescModalTitle').innerText = photo.title;
                document.getElementById('fullDescModalContent').innerHTML = photo.desc || '無說明';
                document.getElementById('fullDescModal').classList.remove('hidden');
            }
        };

        // --- 6. 權限與登入 ---
        const toggleAuth = () => {
            if (isAdmin) { isAdmin = false; updateAuthUI(); showToast("已登出管理員身分"); } 
            else { document.getElementById('loginModal').classList.remove('hidden'); }
        };

        const checkLogin = async () => {
            const u = document.getElementById('loginUsername').value, p = document.getElementById('loginPassword').value;
            if (!u || !p) { showToast("請輸入帳號密碼", "error"); return; }
            if (usersData.find(usr => usr.username === u && usr.password === p)) {
                isAdmin = true; closeModal('loginModal'); updateAuthUI(); showToast("登入成功");
            } else if (usersData.length === 0 && u === 'admin' && p === 'admin123') {
                isAdmin = true; await addDoc(collection(db, 'artifacts', systemAppId, 'public', 'data', 'accounts'), { username: u, password: p });
                closeModal('loginModal'); updateAuthUI(); showToast("預設管理員建立成功");
            } else { showToast("帳密錯誤", "error"); }
        };

        const updateAuthUI = () => {
            document.getElementById('authTextDesktop').innerText = isAdmin ? "登出管理員" : "管理員登入";
            document.getElementById('authIconDesktop').className = isAdmin ? "ph-fill ph-sign-out text-lg text-red-400" : "ph ph-user text-lg text-blue-200";
            document.getElementById('authTextMobile').innerText = isAdmin ? "登出" : "管理員";
            document.getElementById('authIconMobile').className = isAdmin ? "ph-fill ph-sign-out text-lg text-red-400" : "ph ph-user text-lg text-blue-200";
            
            document.getElementById('adminToolbar').classList.toggle('hidden', !isAdmin);
            document.getElementById('editTitleBtn').classList.toggle('hidden', !isAdmin);
            renderGallery();
        };

        // 帳號 CRUD (略縮)
        const renderUsers = () => {
            document.getElementById('userListBody').innerHTML = usersData.length ? usersData.map(u => `
                <tr class="hover:bg-slate-50"><td class="px-5 py-3 text-sm font-semibold">${u.username}</td>
                <td class="px-5 py-3 text-right"><button onclick="editUser('${u.id}')" class="text-blue-600 mr-4">修改</button>
                <button onclick="promptDelete(null, '${u.id}', 'user')" class="text-red-500">刪除</button></td></tr>`).join('') 
                : '<tr><td colspan="2" class="px-5 py-6 text-center text-slate-400">尚無帳號</td></tr>';
        };

        const saveUser = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editUserId').value;
            const payload = { username: document.getElementById('editUsername').value, password: document.getElementById('editPassword').value };
            closeModal('accountEditModal');
            id ? await updateDoc(doc(db, 'artifacts', systemAppId, 'public', 'data', 'accounts', id), payload) : await addDoc(collection(db, 'artifacts', systemAppId, 'public', 'data', 'accounts'), payload);
            showToast(id ? "已更新" : "已建立");
        };

        // --- 7. UI 控制函數 ---
        const handleSearch = () => { searchQuery = document.getElementById('searchInput').value.trim().toLowerCase(); currentPage = 1; renderGallery(); };
        const closeModal = (id) => document.getElementById(id).classList.add('hidden');
        const openTitleModal = () => { document.getElementById('editWebsiteTitle').value = globalSettings.title; document.getElementById('titleEditModal').classList.remove('hidden'); };
        const openTagsModal = () => { document.getElementById('tagsManageModal').classList.remove('hidden'); };
        const openAccountListModal = () => document.getElementById('accountListModal').classList.remove('hidden');
        const openAccountEditModal = () => { document.getElementById('editUserId').value = ''; document.getElementById('accountEditModalTitle').innerText = '新增帳號'; document.getElementById('accountEditModal').classList.remove('hidden'); };
        const editUser = (id) => { const u = usersData.find(x => x.id === id); document.getElementById('editUserId').value = u.id; document.getElementById('editUsername').value = u.username; document.getElementById('editPassword').value = u.password; document.getElementById('accountEditModalTitle').innerText = '修改密碼'; document.getElementById('accountEditModal').classList.remove('hidden'); };
        const openPhotoModal = () => { document.getElementById('photoForm').reset(); document.getElementById('photoId').value = ''; document.getElementById('photoDate').value = new Date().toISOString().split('T')[0]; quillEditor.root.innerHTML = ''; document.querySelectorAll('.tag-checkbox').forEach(cb => cb.checked = false); document.getElementById('photoModalTitle').innerText = '新增相簿'; document.getElementById('photoModal').classList.remove('hidden'); };
        
        let toastTimeout;
        const showToast = (msg, type = 'success') => {
            document.getElementById('toastMessage').innerText = msg;
            document.getElementById('toastIcon').className = type === 'success' ? "ph-fill ph-check-circle text-sky-400 text-xl mr-3" : "ph-fill ph-warning-circle text-red-400 text-xl mr-3";
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100');
            clearTimeout(toastTimeout); toastTimeout = setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
        };

        // 綁定全域
        Object.assign(window, { toggleAuth, checkLogin, closeModal, openPhotoModal, editPhoto, savePhoto, promptDelete, confirmDelete, recordView, openAccountListModal, openAccountEditModal, editUser, saveUser, handleSearch, changePage, openTitleModal, saveWebsiteTitle, openTagsModal, addNewTag, deleteTag, openFullDesc });

        initSystem();
    </script>
</body>
</html>
